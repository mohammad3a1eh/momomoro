<!doctype html>
<html lang="fa" dir="rtl">
<head>

<body>
  <main>
    <span class="dot"></span>

    <p>برای استفاده از تایمر و دیدن پروفایل‌ها باید آنلاین باشی.</p>
    <button onclick="location.reload()">تلاش دوباره</button>
  </main>
